<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <title>Nuovo Intervento</title>
    <script>
        function showTable() {
            document.getElementById("resultsTable").classList.remove("hidden");
        }
    </script>
</head>
<body>
    <header th:insert="~{fragments/navbar.html}"></header>
    <div class="container mt-5">
        <div class="d-flex justify-content-center">
            <div class="w-100" style="max-width: 600px;">
                <h1 class="text-center mb-3">Nuovo Intervento</h1>
              
                <form th:action="@{/interventi/searchElement}" method="post" th:onsubmit="showTable()">
                    <div class="container-fluid mt-3">
                        <div class="d-flex align-items-center">
                            <input id="matricolaBnr" class="form-control me-2" type="text" name="matricolaBnr" placeholder="Cerca Bnr per matricola" required> 
                            <button class="btn btn-outline-primary" type="submit">Cerca</button>
                        </div>
                    </div>
                </form>


                <form th:action="@{/interventi/searchElement}" method="post">
                    <div class="container-fluid mt-3">
                        <div class="d-flex align-items-center">
                            <input id="matricolaCls" class="form-control me-2" type="text" name="matricolaCls" placeholder="Cerca Cls per matricola" required>
                            <button class="btn btn-outline-primary" type="submit">Cerca</button>
                        </div>
                    </div>
                </form>
                <form th:action="@{/interventi/searchElement}" method="post">
                    <div class="container-fluid mt-3">
                        <div class="d-flex align-items-center">
                            <input id="matricolaRiciclatore" class="form-control me-2" type="text" name="matricolaRiciclatore" placeholder="Cerca Riciclatore per matricola" required>
                            <button class="btn btn-outline-primary" type="submit">Cerca</button>
                        </div>
                    </div>
                </form>
                <form th:action="@{/interventi/searchElement}" method="post">
                    <div class="container-fluid mt-3">
                        <div class="d-flex align-items-center">
                            <input id="matricolaMacchina" class="form-control me-2" type="text" name="matricolaMacchina" placeholder="Cerca Macchina per matricola" required>
                            <button class="btn btn-outline-primary" type="submit">Cerca</button>
                        </div>
                    </div>
                </form>
                <form th:action="@{/interventi/searchElement}" method="post">
                    <div class="container-fluid mt-3">
                        <div class="d-flex align-items-center">
                            <input id="cliente" class="form-control me-2" type="text" name="cliente" placeholder="Cerca Cliente per Ragione Sociale o Alias" required>
                            <button class="btn btn-outline-primary" type="submit">Cerca</button>
                        </div>
                    </div>
                </form>

            














            <div id="resultsTable" th:if="${listaComponent != null}">
               
                    <div class="table-responsive me-xl-auto" style="padding-top: 20px;">
                        <table class="table table-hover text-center">
                            <thead class="thead-dark">
                                <tr>
                                    <th scope="col">#</th>
                                    <th scope="col">Cliente</th>
                                    <th scope="col">Matricola</th>
                                    <th scope="col">Modello</th>
                                    <th scope="col">Assistenza</th>
                                    <th scope="col"></th>
                                </tr>
                            </thead>
                            <tbody class="table-group-divider">
                                <tr th:each="component : ${listaComponent}">
                                    <td th:text="${component.id}">#</td>
                                    <td th:text="${component.macchina?.cliente?.ragioneSociale ?: 'Cliente non disponibile'}">Cliente</td>
                                    <td th:text="${component.matricola}">Matricola</td>
                                    <td th:text="${component.modello}">Modello</td>
                                    <td>
                                        <input type="checkbox" th:checked="${component.assistenza}" disabled>
                                    </td>
                                    <td>
                                        <button>Clik!</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                
            </div>
      
       
            <div id="resultsTable" th:if="${listaCliente != null}">
               
                <div class="table-responsive me-xl-auto" style="padding-top: 20px;">
                    <table class="table table-hover text-center">
                        <thead class="thead-dark">
                            <tr>
                                <th scope="col">Ragione Sociale</th>
                                
                                <th scope="col">Macchina</th>
                                <th scope="col">Bnr</th>
                                <th scope="col">Cls</th>
                                <th scope="col">Riciclatore</th>
                                <th scope="col"></th>
                            </tr>
                        </thead>
                        <tbody class="table-group-divider">
                            <tr th:each="cliente, iter : ${listaCliente}">
                                <!-- La prima riga per ogni cliente -->
                                <td th:text="${cliente.ragioneSociale}">Ragione Sociale</td>
                                
                                <!-- Colonna Macchina, Bnr, Cls -->
                                <td colspan="5">
                                    <table class="table">
                                        <tbody>
                                            <tr th:each="macchina : ${cliente.macchina}">
                                                <td th:text="${macchina?.matricola}">Macchina</td>
                                                <td th:text="${macchina?.bnr?.matricola ?: 'Nessun Bnr'}">Bnr</td>
                                                <td th:text="${macchina?.cls?.matricola ?: 'Nessun Cls'}">Cls</td>
                                                <td th:text="${macchina?.riciclatore?.matricola ?: 'Nessun Riciclatore'}">Riciclatore</td>
                                                <td>
                                                    <button>Click!</button>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    
                </div>
            
        </div>





          
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
